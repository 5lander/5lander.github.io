<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Alert, Toast, Spinner, Skeleton, EmptyState, Button } = window.NoctisCommerceDesignSystem_4dfd35;
function Demo(){

    <div>
      <div className="grp">Alert (inline)</div>

        <Alert tone="info"><b>Info.</b> Buscador client-side por ahora.</Alert>
        <Alert tone="success"><b>Listo.</b> Stock actualizado.</Alert>
        <Alert tone="warning"><b>Atención.</b> El certificado vence en 30 días.</Alert>
        <Alert tone="danger"><b>No autorizado.</b> No puede anular ventas.</Alert>
      </div>
      <div className="grp">Toast · Spinner</div>
      <div className="row">
        <Toast autoDismiss={0}>Invitación reenviada a agustina@aguilar.ec</Toast>
        <span style={{display:'inline-flex',alignItems:'center',gap:10}}><Spinner/><span style={{fontSize:12,color:'hsl(var(--text-tertiary))'}}>Gate de permiso</span></span>
      </div>
      <div style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'flex-start'}}>

          <div className="grp">Skeleton</div>
          <Skeleton variant="block" height={44} style={{marginBottom:10}}/>
          <Skeleton variant="line" width="90%" style={{marginBottom:7}}/>
          <Skeleton variant="line" width="70%" style={{marginBottom:7}}/>
          <Skeleton variant="line" width="50%"/>
        </div>
        <div style={{flex:'0 0 300px'}}>
          <div className="grp">EmptyState</div>

        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
