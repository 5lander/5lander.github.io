<!-- @dsCard group="Iconography" viewport="760x360" name="Set de módulos (Lucide)" subtitle="Line icons, un solo peso · mapa módulo→ícono compartido por commerce y backoffice" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:hsl(var(--surface-sunken));font-family:var(--font-ui);color:hsl(var(--text-primary));}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Icon } = window.NoctisCommerceDesignSystem_4dfd35;
const MODS = [
  ['pos', 'POS'], ['ventas', 'Ventas'], ['clientes', 'Clientes'], ['productos', 'Productos'],
  ['categorias', 'Categorías'], ['precios', 'Precios'], ['inventario', 'Inventario'], ['compras', 'Compras'],
  ['facturacion', 'Facturación SRI'], ['tesoreria', 'Tesorería'], ['contabilidad', 'Contabilidad'],
  ['reportes', 'Reportes'], ['nomina', 'Nómina'], ['config.empresa', 'Empresa'],
  ['config.usuarios', 'Usuarios'], ['administracion', 'Administración'],
];
function Card() {
  return (
    <div style={{ padding: 22 }}>
      <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '.09em', color: 'hsl(var(--text-tertiary))', fontWeight: 600, marginBottom: 4 }}>Iconografía · sistema</div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginBottom: 16 }}>
        <div style={{ font: '600 18px/22px var(--font-ui)', letterSpacing: '-.01em' }}>Set de módulos</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, color: 'hsl(var(--text-tertiary))' }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="package" size={16} /> 16</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="package" size={20} /> 20</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="package" size={24} /> 24</span>
        </div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 10 }}>
        {MODS.map(([id, label]) => (
          <div key={id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', border: '1px solid hsl(var(--border-subtle))', borderRadius: 10, background: 'hsl(var(--surface-raised))' }}>
            <span style={{ color: 'hsl(var(--text-secondary))' }}><Icon module={id} size={20} /></span>
            <span style={{ fontSize: 12, color: 'hsl(var(--text-primary))' }}>{label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
