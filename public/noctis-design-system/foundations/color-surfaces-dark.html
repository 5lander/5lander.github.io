<!-- @dsCard group="Colors" viewport="700x150" name="Superficies · oscuro" subtitle="Mismo eje MODO, remapeado — surface-sunken es negro puro" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:hsl(var(--surface-sunken));font-family:var(--font-ui);}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}.sw{border-radius:10px;height:56px;border:1px solid hsl(var(--border-strong));}.lbl{font:500 11px/1.3 var(--font-ui);margin-top:6px;color:hsl(var(--text-primary));}.mono{font:400 10px/1.3 var(--font-mono);color:hsl(var(--text-tertiary));}</style>
</head><body data-mode="dark">
<div class="grid">
<div><div class="sw" style="background:hsl(var(--surface-base))"></div><div class="lbl">surface-base</div><div class="mono">240 6% 11%</div></div>
<div><div class="sw" style="background:hsl(var(--surface-raised))"></div><div class="lbl">surface-raised</div><div class="mono">240 4% 18%</div></div>
<div><div class="sw" style="background:hsl(var(--surface-sunken))"></div><div class="lbl">surface-sunken</div><div class="mono">0 0% 0%</div></div>
<div><div class="sw" style="background:hsl(var(--surface-overlay));box-shadow:var(--shadow-overlay)"></div><div class="lbl">surface-overlay</div><div class="mono">240 4% 20%</div></div>
<div><div class="sw" style="background:hsl(var(--border-subtle))"></div><div class="lbl">border-subtle</div><div class="mono">240 3% 22%</div></div>
<div><div class="sw" style="background:hsl(var(--border-strong))"></div><div class="lbl">border-strong</div><div class="mono">240 2% 30%</div></div>
</div>
</body></html>
