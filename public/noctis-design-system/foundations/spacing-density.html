<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div class="cols">
<div class="col"><div class="h">Back-office (comfortable)</div><div class="ctrl" style="height:36px">Campo · control-h 36</div><div class="mono">control-h 36 · row-h 40 · pad 12 · body 14 · hit-min 36</div></div>
<div class="col" data-density="touch"><div class="h">Táctil-POS (touch)</div><div class="ctrl" style="height:var(--control-h)">Campo · control-h 48</div><div class="mono">control-h 48 · row-h 56 · pad 16 · body 16 · hit-min 48</div></div>
