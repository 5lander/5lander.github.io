<!-- @dsCard group="Type" viewport="700x150" name="Mono y números tabulares" subtitle="IBM Plex Mono para codes/IDs · tabular-nums en montos/tablas/kardex" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:hsl(var(--surface-raised));font-family:var(--font-ui);color:hsl(var(--text-primary));}.r{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid hsl(var(--border-subtle));}.r:last-child{border:none;}.mono{font:400 11px/1 var(--font-mono);color:hsl(var(--text-tertiary));margin-left:auto;}.tab{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}</style>
</head><body>
<div class="r"><span class="tab" style="font:500 28px/1 var(--font-ui);letter-spacing:-.01em">$1.234.567,89</span><span class="mono">tabular-nums · montos/tablas/kardex</span></div>
<div class="r"><span style="font:400 13px/1 var(--font-mono)">RUC 1790012345001</span><span class="mono">IBM Plex Mono · codes/montos/IDs</span></div>
<div class="r"><span class="tab" style="font:400 13px/1 var(--font-mono)">0123456789 · alineación de columnas</span><span class="mono">columnas que alinean</span></div>
</body></html>
