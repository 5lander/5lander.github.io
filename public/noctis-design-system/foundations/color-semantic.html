<!-- @dsCard group="Colors" viewport="700x150" name="Semánticos" subtitle="Por rol, nunca por hex · fg / bg / border remapeados por modo" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:hsl(var(--surface-raised));font-family:var(--font-ui);}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}.cell{border:1px solid;border-radius:10px;padding:12px 14px;}.dot{width:20px;height:20px;border-radius:6px;margin-bottom:8px;}.name{font:600 13px/1 var(--font-ui);}.mono{font:400 10px/1.3 var(--font-mono);color:hsl(var(--text-tertiary));margin-top:3px;}</style>
</head><body>
<div class="grid">
<div class="cell" style="background:hsl(var(--success-bg));border-color:hsl(var(--success-border))"><div class="dot" style="background:hsl(var(--success-fg))"></div><div class="name" style="color:hsl(var(--success-fg))">Éxito</div><div class="mono">--success-*</div></div>
<div class="cell" style="background:hsl(var(--warning-bg));border-color:hsl(var(--warning-border))"><div class="dot" style="background:hsl(var(--warning-fg))"></div><div class="name" style="color:hsl(var(--warning-fg))">Atención</div><div class="mono">--warning-*</div></div>
<div class="cell" style="background:hsl(var(--danger-bg));border-color:hsl(var(--danger-border))"><div class="dot" style="background:hsl(var(--danger-fg))"></div><div class="name" style="color:hsl(var(--danger-fg))">Peligro</div><div class="mono">--danger-*</div></div>
<div class="cell" style="background:hsl(var(--info-bg));border-color:hsl(var(--info-border))"><div class="dot" style="background:hsl(var(--info-fg))"></div><div class="name" style="color:hsl(var(--info-fg))">Info</div><div class="mono">--info-*</div></div>
</div>
</body></html>
