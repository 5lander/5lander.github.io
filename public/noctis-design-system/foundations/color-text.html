<!-- @dsCard group="Colors" viewport="700x150" name="Texto · roles y contraste" subtitle="Estable ante el tenant, variable ante el modo · AA/AAA declarado" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:hsl(var(--surface-raised));font-family:var(--font-ui);}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}.cell{border:1px solid hsl(var(--border-subtle));border-radius:10px;padding:12px 14px;background:hsl(var(--surface-base));}.aa{font:700 22px/1 var(--font-ui);}.lbl{font:500 12px/1.3 var(--font-ui);margin-top:8px;color:hsl(var(--text-primary));}.mono{font:400 10px/1.3 var(--font-mono);color:hsl(var(--text-tertiary));}</style>
</head><body>
<div class="grid">
<div class="cell"><span class="aa" style="color:hsl(var(--text-primary))">Aa</span><div class="lbl">text-primary</div><div class="mono">240 6% 12% · 16.9:1 AAA</div></div>
<div class="cell"><span class="aa" style="color:hsl(var(--text-secondary))">Aa</span><div class="lbl">text-secondary</div><div class="mono">240 3% 32% · 8.6:1 AAA</div></div>
<div class="cell"><span class="aa" style="color:hsl(var(--text-tertiary))">Aa</span><div class="lbl">text-tertiary</div><div class="mono">240 4% 40% · 5.6:1 AA</div></div>
<div class="cell"><span class="aa" style="color:hsl(var(--text-disabled))">Aa</span><div class="lbl">text-disabled</div><div class="mono">240 4% 70%</div></div>
</div>
</body></html>
