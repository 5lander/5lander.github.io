<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Login Noctis" description="Pantalla de acceso compartida — momento negro (negro y plata) + formulario neutro de casa" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:hsl(var(--surface-sunken));font-family:var(--font-ui);color:hsl(var(--text-primary));">
  <div style="width:min(760px,100%);border:1px solid hsl(var(--border-subtle));border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:hsl(var(--surface-raised));">
    <div style="position:relative;padding:32px 28px;background:linear-gradient(150deg,#000 0%,#1C1C1E 65%,#2C2C2E 100%);overflow:hidden;">
      <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 90% -20%, rgba(255,255,255,.07), transparent 60%);"></div>
      <div style="position:relative;">
        <x-import component-from-global-scope="NoctisCommerceDesignSystem_4dfd35.Wordmark" on-dark="{{ true }}" hint-size="200px,34px"></x-import>
        <div style="font:500 24px/1.2 var(--font-ui);color:#F5F5F7;margin-top:20px;letter-spacing:-.01em;">Inicie sesión</div>
        <p style="margin:8px 0 0;color:#AEAEB2;font-size:13px;max-width:34ch;">Núcleo compartido entre commerce y backoffice. Negro y plata, disciplina de hardware — sin editorial dentro de la herramienta.</p>
      </div>
    </div>
    <div style="padding:28px 24px;display:flex;flex-direction:column;gap:14px;">
      <x-import component-from-global-scope="NoctisCommerceDesignSystem_4dfd35.Input" label="Correo" default-value="agustina@aguilar.ec" hint-size="100%,64px"></x-import>
      <x-import component-from-global-scope="NoctisCommerceDesignSystem_4dfd35.Input" label="Contraseña" type="password" default-value="claveSegura1" hint-size="100%,64px"></x-import>
      <x-import component-from-global-scope="NoctisCommerceDesignSystem_4dfd35.Button" variant="primary" style="width:100%" hint-size="100%,36px">Ingresar</x-import>
      <span style="font-size:11px;color:hsl(var(--text-tertiary));">Hueco conocido: «olvidé mi clave» no existe en el roadmap — se señala, no se inventa.</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
